# PREPARED ONLY (Stage 2). forest-api reads satellite.db read-only for display and writes only small job/review
# rows (D2). Without this the API would look for data/satellite.db inside the release folder.
[Service]
Environment=SAT_DATA_DIR=/root/forest_ai_satellite_data
Environment=SAT_DB_PATH=/root/forest_ai_satellite_data/satellite.db
Environment=SAT_RASTER_DIR=/root/forest_ai_satellite_data/satellite
